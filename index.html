<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09111f">
  <meta name="description" content="TWEN Trade — 使用虛擬資金練習台股與 ETF，從新手教學開始理解市場。">
  <title>TWEN Trade — Paper Trading</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#overview" aria-label="TWEN Trade home">
        <span class="brand-mark">T</span>
        <span class="brand-name">TWEN<span>TRADE</span></span>
      </a>
      <div class="workspace-label" data-i18n="workspace">WORKSPACE</div>
      <nav class="side-nav" id="sideNav">
        <button class="nav-item active" data-page="overview"><span class="nav-icon">◫</span><span data-i18n="overview">總覽</span></button>
        <button class="nav-item" data-page="markets"><span class="nav-icon">⌁</span><span data-i18n="markets">市場行情</span></button>
        <button class="nav-item" data-page="portfolio"><span class="nav-icon">▤</span><span data-i18n="portfolio">投資組合</span></button>
        <button class="nav-item" data-page="orders"><span class="nav-icon">↕</span><span data-i18n="orders">交易紀錄</span></button>
        <button class="nav-item" data-page="watchlist"><span class="nav-icon">☆</span><span data-i18n="watchlist">自選清單</span></button>
        <div class="nav-separator"></div>
        <div class="workspace-label" data-i18n="discover">DISCOVER</div>
        <button class="nav-item" data-page="learn"><span class="nav-icon">⌘</span><span data-i18n="learn">投資學院</span><span class="nav-pill">NEW</span></button>
        <button class="nav-item" data-page="leaderboard"><span class="nav-icon">♙</span><span data-i18n="leaderboard">排行榜</span></button>
        <button class="nav-item" data-page="announcements"><span class="nav-icon">◉</span><span data-i18n="announcements">平台公告</span></button>
        <button class="nav-item admin-only hidden" data-page="admin"><span class="nav-icon">⚙</span><span data-i18n="admin">管理後台</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="market-status"><span class="status-dot"></span><span data-i18n="paperMode">模擬交易模式</span></div>
        <div class="sidebar-user" id="sidebarUser">
          <div class="avatar">G</div><div class="sidebar-user-copy"><b data-i18n="guest">訪客</b><small data-i18n="signInToSave">登入以保存進度</small></div>
          <button class="icon-button" id="userMenuBtn" title="Account" data-i18n-title="accountMenu">···</button>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu icon-button" id="mobileMenu" aria-label="開啟選單" data-i18n-aria="openMenu">☰</button>
        <div class="breadcrumb"><span>TWEN TRADE</span><span class="crumb-slash">/</span><b id="pageHeading">總覽</b></div>
        <div class="top-actions">
          <div class="market-clock"><span class="tiny-dot"></span><span data-i18n="taiwanMarket">台灣市場</span><span class="clock-divider">·</span><span id="marketDate">行情載入中</span></div>
          <button class="lang-toggle" id="langToggle">EN</button>
          <button class="icon-button notification-btn" data-page="announcements" aria-label="公告" data-i18n-aria="announcements">♧<i id="announcementDot"></i></button>
          <button class="login-top" id="topLogin" data-i18n="login">登入</button>
        </div>
      </header>

      <section class="page-wrap">
        <div class="notice-banner" id="marketNotice"><span class="notice-symbol">ⓘ</span><span id="marketNoticeText">正在連線官方公開行情資料…</span></div>
        <div id="pageContent" aria-live="polite"></div>
        <footer class="app-footer"><span>© 2026 TWEN Trade</span><span data-i18n="footerNote">教育與模擬用途，不構成投資建議。</span><span>TWD · Taiwan</span></footer>
      </section>
    </main>
  </div>

  <nav class="mobile-bottom-nav" id="mobileBottomNav">
    <button class="active" data-page="overview"><span>◫</span><small data-i18n="overview">總覽</small></button>
    <button data-page="markets"><span>⌁</span><small data-i18n="markets">行情</small></button>
    <button data-page="portfolio"><span>▤</span><small data-i18n="portfolio">資產</small></button>
    <button data-page="learn"><span>⌘</span><small data-i18n="learn">學習</small></button>
    <button data-page="orders"><span>↕</span><small data-i18n="orders">紀錄</small></button>
  </nav>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close icon-button" id="modalClose" aria-label="關閉" data-i18n-aria="close">×</button>
      <div id="modalContent"></div>
    </section>
  </div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
